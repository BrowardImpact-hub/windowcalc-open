name: CI

# Runs on every push to main and every pull request. Holds no credentials.
# The server boots on a throwaway SQLite database with demo data, exactly as
# verify.ps1 does on Windows.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend boots and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python compiles
        run: python -m py_compile server.py pricing_engine.py run_local.py

      - name: Boot on SQLite and check routes
        env:
          DB_PATH: ${{ runner.temp }}/ci.db
          SEED_DEMO_DATA: "1"
          CHAT_MEDIA_STORAGE: local
          PORT: "8080"
        run: |
          python server.py > "$RUNNER_TEMP/server.log" 2>&1 &
          code=000
          for i in $(seq 1 90); do
            code=$(curl -s -o "$RUNNER_TEMP/health.json" -w '%{http_code}' http://127.0.0.1:8080/api/health || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          cat "$RUNNER_TEMP/health.json" || true; echo
          if [ "$code" != "200" ] || ! grep -q '"status": *"ok"' "$RUNNER_TEMP/health.json"; then
            echo "::error::/api/health did not return status ok (HTTP $code)"
            tail -50 "$RUNNER_TEMP/server.log"
            exit 1
          fi
          index=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)
          locked=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/quotes)
          echo "/ -> $index    /api/quotes without login -> $locked"
          [ "$index" = "200" ] || { echo "::error::/ returned $index, expected 200"; exit 1; }
          [ "$locked" = "401" ] || { echo "::error::/api/quotes without login returned $locked, expected 401"; exit 1; }

      - name: Docker image builds
        run: docker build -t windowcalc-ci .

  web:
    name: Web JavaScript parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check
        run: |
          node --check static/app.js
          node --check static/sw.js

  mobile:
    name: Mobile app type-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

  secret-scan:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject credential, keystore and database files
        run: |
          if git ls-files | grep -iE '(^|/)\.env$|\.env\.local$|\.db$|\.sqlite[0-9]?$|\.key$|\.pem$|\.pfx$|\.p12$|\.jks$|\.keystore$|(^|/)service-account[^/]*\.json$|google-services\.json$|GoogleService-Info\.plist$'; then
            echo "::error::A credential, keystore, or database file is committed."
            exit 1
          fi
          echo "No credential, keystore, or database files are tracked."

      - name: Reject credential-shaped strings
        run: |
          if git grep -nIE '(sk-[A-Za-z0-9_-]{24,}|AIza[A-Za-z0-9_-]{30,}|AKIA[A-Z0-9]{12,}|gh[pousr]_[A-Za-z0-9]{20,}|AC[a-f0-9]{32}|SK[a-f0-9]{32}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|"private_key"[[:space:]]*:)' -- ':!*package-lock.json'; then
            echo "::error::A credential-shaped string is committed."
            exit 1
          fi
          echo "No credential-shaped strings found."
